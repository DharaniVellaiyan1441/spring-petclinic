server.port: 8888
spring:
  profiles:
    active: native
  cloud:
    config:
      server:
        # Prefer a local filesystem repo so the config server works without internet access.
        # Set GIT_REPO to a custom config directory when needed, otherwise ./config-repo is used.
        native:
          searchLocations: file:${GIT_REPO:../config-repo}

