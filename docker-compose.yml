services:
  config-server:
    image: spring-petclinic-config-server:v1
    container_name: config-server
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - GIT_REPO=/config-repo
      - CONFIG_SERVER_URL=http://config-server:8888/
    command:
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    volumes:
      - ./config-repo:/config-repo:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
     - 8888:8888
    networks:
      - petclinic-net

  discovery-server:
    image: spring-petclinic-discovery-server:v1
    container_name: discovery-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    command:
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    ports:
     - 8761:8761
    networks:
      - petclinic-net

  customers-service:
    image: spring-petclinic-customers-service:v1
    container_name: customers-service
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: customers-service
      SPRING_PROFILES_ACTIVE: docker,mysql
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/petclinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    command:
      - "--spring.application.name=customers-service"
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_started
    ports:
    - 8081:8081
    networks:
      - petclinic-net

  visits-service:
    image: spring-petclinic-visits-service:v1
    container_name: visits-service
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: visits-service
      SPRING_PROFILES_ACTIVE: docker,mysql
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/petclinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    command:
      - "--spring.application.name=visits-service"
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_started
    ports:
     - 8082:8082
    networks:
      - petclinic-net

  vets-service:
    image: spring-petclinic-vets-service:v1
    container_name: vets-service
    environment:
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: vets-service
      SPRING_PROFILES_ACTIVE: docker,mysql
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/petclinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    command:
      - "--spring.application.name=vets-service"
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_started
    ports:
     - 8083:8083
    networks:
      - petclinic-net

  genai-service:
    image: spring-petclinic-genai-service:v1
    container_name: genai-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
    command:
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8084:8084
    networks:
      - petclinic-net

  api-gateway:
    image: spring-petclinic-api-gateway:v1
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    command:
      - "--spring.application.name=api-gateway"
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8080:8080
    networks:
      - petclinic-net

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9411:9411
    networks:
      - petclinic-net

  admin-server:
    image: spring-petclinic-admin-server:v1
    container_name: admin-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    command:
      - "--eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/"
      - "--management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans"
      - "--management.endpoints.web.exposure.include=*"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090
    networks:
      - petclinic-net

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3030:3000
    networks:
      - petclinic-net

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090
    networks:
      - petclinic-net

  mysql:
    image: mysql:8.4.5
    container_name: mysql-server
    environment:
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petclinic
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    ports:
      - "3306:3306"
    networks:
      - petclinic-net

networks:
  petclinic-net:
    driver: bridge

